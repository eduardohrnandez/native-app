name: Android APK

# Builds an installable APK on GitHub's runners, without an Expo account or a local Android setup.
on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    apk:
        # Pinned: ubuntu-latest is moving to a new image this month, and 24.04 ships the Android SDK.
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        steps:
            # The runner died twice mid-build. Free the preinstalled toolchains this build never uses and put swap on
            # the larger /mnt disk, so neither memory nor the root disk runs out.
            - name: Free disk space and add swap
              run: |
                  sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
                  sudo fallocate -l 8G /mnt/swap-extra
                  sudo chmod 600 /mnt/swap-extra
                  sudo mkswap /mnt/swap-extra
                  sudo swapon /mnt/swap-extra
                  df -h / /mnt
                  free -h

            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            # Caches Gradle's downloads and build outputs so later builds only redo what changed.
            - uses: gradle/actions/setup-gradle@v4

            - name: Install pnpm
              run: npm install -g pnpm@11.20.0

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build translations
              working-directory: apps/native
              run: pnpm exec intlayer build

            - name: Generate the Android project
              working-directory: apps/native
              env:
                  CI: "1"
              run: pnpm exec expo prebuild --platform android --no-install --clean

            # Later keys win in gradle.properties: fewer workers and no R8 shrinking keep memory inside the runner.
            - name: Tune Gradle for the runner
              working-directory: apps/native/android
              run: |
                  cat >> gradle.properties <<'PROPS'
                  org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
                  org.gradle.workers.max=2
                  org.gradle.parallel=false
                  kotlin.daemon.jvmargs=-Xmx1536m
                  android.enableMinifyInReleaseBuilds=false
                  android.enableShrinkResourcesInReleaseBuilds=false
                  reactNativeArchitectures=arm64-v8a
                  PROPS

            - name: Build the release APK
              working-directory: apps/native/android
              run: |
                  set -o pipefail
                  (while true; do sleep 120; echo "--- $(date -u +%T)"; df -h / | tail -1; free -m | head -2 | tail -1; done) &
                  ./gradlew assembleRelease --max-workers=2 2>&1 | tee "$RUNNER_TEMP/gradle.log"

            # The run log is not reachable from every place this is debugged from, so a failure leaves its tail in git.
            - name: Save the build log on failure
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tail -n 400 "$RUNNER_TEMP/gradle.log" > /tmp/gradle-tail.log || echo "no gradle log" > /tmp/gradle-tail.log
                  git config user.name "github-actions"
                  git config user.email "github-actions@users.noreply.github.com"
                  git checkout --orphan "ci-logs-${{ github.run_number }}"
                  git rm -rfq --cached .
                  cp /tmp/gradle-tail.log gradle-tail.log
                  git add gradle-tail.log
                  git commit -qm "Build log tail for run ${{ github.run_number }}"
                  git push -q origin "HEAD:refs/heads/ci-logs-${{ github.run_number }}"

            - name: Publish the APK as a release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  cp apps/native/android/app/build/outputs/apk/release/app-release.apk "finta-${{ github.run_number }}.apk"
                  gh release create "apk-${{ github.run_number }}" "finta-${{ github.run_number }}.apk" \
                    --prerelease --title "Finta APK #${{ github.run_number }}" \
                    --notes "APK de prueba generado desde ${{ github.sha }}."
