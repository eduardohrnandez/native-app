name: Android APK

# Builds an installable APK on GitHub's runners, without an Expo account or a local Android setup.
on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    apk:
        # Pinned: ubuntu-latest is moving to a new image this month, and 24.04 ships the Android SDK.
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        env:
            # A publishable key, made to ship inside apps; logo.dev's free plan asks for the credit in Settings › About.
            EXPO_PUBLIC_LOGO_DEV_TOKEN: pk_ds1RNpJiTl6tzoNqlO7qRg
        steps:
            # The runner died twice mid-build. Free the preinstalled toolchains this build never uses and put swap on
            # the larger /mnt disk, so neither memory nor the root disk runs out.
            - name: Free disk space and add swap
              run: |
                  sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
                  sudo fallocate -l 8G /mnt/swap-extra
                  sudo chmod 600 /mnt/swap-extra
                  sudo mkswap /mnt/swap-extra
                  sudo swapon /mnt/swap-extra
                  df -h / /mnt
                  free -h

            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            # Caches Gradle's downloads and build outputs so later builds only redo what changed.
            - uses: gradle/actions/setup-gradle@v4

            - name: Install pnpm
              run: npm install -g pnpm@11.20.0

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build translations
              working-directory: apps/native
              run: pnpm exec intlayer build

            - name: Generate the Android project
              working-directory: apps/native
              env:
                  CI: "1"
                  # The versionCode is the run number, which is also the release tag the app compares against.
                  BUILD_NUMBER: ${{ github.run_number }}
              run: pnpm exec expo prebuild --platform android --no-install --clean

            # Later keys win in gradle.properties: fewer workers and no R8 shrinking keep memory inside the runner.
            # Public repos get 4 cores and 16 GB on this runner, so Gradle can use all of them.
            - name: Tune Gradle for the runner
              working-directory: apps/native/android
              run: |
                  cat >> gradle.properties <<'PROPS'
                  org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
                  org.gradle.parallel=true
                  org.gradle.caching=true
                  kotlin.daemon.jvmargs=-Xmx2g
                  android.enableMinifyInReleaseBuilds=false
                  android.enableShrinkResourcesInReleaseBuilds=false
                  reactNativeArchitectures=arm64-v8a
                  PROPS

            # The native modules' C++ is most of the build and rarely changes between releases.
            - name: Cache compiled C++
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                  key: android-arm64
                  max-size: 2G

            - name: Build the release APK
              working-directory: apps/native/android
              env:
                  CMAKE_C_COMPILER_LAUNCHER: ccache
                  CMAKE_CXX_COMPILER_LAUNCHER: ccache
              run: |
                  set -o pipefail
                  (while true; do sleep 120; echo "--- $(date -u +%T)"; df -h / | tail -1; free -m | head -2 | tail -1; done) &
                  if ! ./gradlew assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
                    # Annotations are readable through the API even where the raw run log is not.
                    summary=$(grep -n -A 30 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -n 60)
                    if [ -z "$summary" ]; then summary=$(tail -n 60 "$RUNNER_TEMP/gradle.log"); fi
                    summary=${summary//'%'/'%25'}
                    summary=${summary//$'\n'/'%0A'}
                    summary=${summary//$'\r'/'%0D'}
                    echo "::error title=Gradle build failed::${summary}"
                    exit 1
                  fi

            - name: Publish the APK as a release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  cp apps/native/android/app/build/outputs/apk/release/app-release.apk "finta-${{ github.run_number }}.apk"
                  gh release create "apk-${{ github.run_number }}" "finta-${{ github.run_number }}.apk" \
                    --prerelease --title "Finta APK #${{ github.run_number }}" \
                    --notes "APK de prueba generado desde ${{ github.sha }}."
