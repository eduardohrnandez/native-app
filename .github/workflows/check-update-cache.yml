name: Check update cache

on:
    workflow_dispatch:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            # Asks Convex the same question the app asks, and prints which builds it would offer.
            - name: Ask Convex which releases it serves
              run: |
                  body=$(curl -s -X POST "https://confident-dotterel-266.convex.cloud/api/action" \
                    -H "Content-Type: application/json" \
                    -d '{"path":"appUpdates:latest","args":{},"format":"json"}')
                  status=$(echo "$body" | jq -r '.status')
                  if [ "$status" != "success" ]; then
                    echo "::error title=Convex answered::$(echo "$body" | head -c 400)"
                    exit 1
                  fi
                  tags=$(echo "$body" | jq -r '.value | fromjson | map(select(.draft==false) | .tag_name) | join(", ")')
                  echo "::notice title=Builds served by Convex::${tags}"
